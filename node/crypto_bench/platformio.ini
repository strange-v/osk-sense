; AES-CTR + CMAC prototype for V3 telemetry security
; (../../protocol/V3-SECURITY.md#crypto-measurements).
;
; bench_*  print known-answer results and cycle counts at 9600 baud on PB2.
; size_*   are the same sketch with and without the crypto calls; the
;          difference is the flash cost.
;
; Variants: OSK_AES_FUSED one pass per round, OSK_AES_UNROLL unrolled columns
; (needs FUSED), OSK_AES_O2 round functions at -O2, OSK_SBOX_RAM S-box in SRAM.

[base]
platform = atmelmegaavr
board = ATtiny1614
framework = arduino
board_build.f_cpu = 4000000L
board_hardware.oscillator = internal
board_hardware.bod = 1.8v
board_hardware.eesave = yes
board_hardware.updipin = updi
upload_protocol = serialupdi
upload_port = COM11
upload_speed = 115200
monitor_port = COM12
monitor_speed = 9600

[bench]
extends = base
build_src_filter = +<bench.cpp>

[size]
extends = base
build_src_filter = +<size.cpp>

[env:size_empty]
extends = size

[env:bench]
extends = bench

[env:size]
extends = size
build_flags = -D WITH_CRYPTO

[env:bench_fused]
extends = bench
build_flags = -D OSK_AES_FUSED

[env:size_fused]
extends = size
build_flags = -D WITH_CRYPTO -D OSK_AES_FUSED

[env:bench_unroll]
extends = bench
build_flags = -D OSK_AES_FUSED -D OSK_AES_UNROLL

[env:size_unroll]
extends = size
build_flags = -D WITH_CRYPTO -D OSK_AES_FUSED -D OSK_AES_UNROLL

[env:bench_o2]
extends = bench
build_flags = -D OSK_AES_O2

[env:bench_sram]
extends = bench
build_flags = -D OSK_SBOX_RAM

[env:size_two_keys]
extends = size
build_flags = -D WITH_TWO_KEYS -D OSK_AES_FUSED

[env:size_ccm]
extends = size
build_flags = -D WITH_CCM -D OSK_AES_FUSED

[env:entropy]
extends = base
build_src_filter = +<entropy.cpp>

[env:size_security]
extends = base
lib_extra_dirs = ../../shared
build_src_filter = +<security_size.cpp>
build_flags = -mcall-prologues

[env:size_security_storage]
extends = base
build_src_filter = +<security_storage_size.cpp>
build_flags =
    -mcall-prologues
    -I../lib/NodeCore/include

[env:size_security_frames]
extends = base
lib_extra_dirs = ../../shared
build_src_filter = +<security_frames_size.cpp>
build_flags = -mcall-prologues
