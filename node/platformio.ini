[platformio]
default_envs = climate_tmp112

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17

[node]
platform = atmelmegaavr
board = ATtiny1614
; 4 MHz stays within the ATtiny1614 speed grade down to 1.8 V. Fuses are
; written only by `pio run -t fuses`: BOD 1.8 V is active-mode only, so sleep
; current is unaffected, and EESAVE keeps counter and network state across
; reflashing.
board_build.f_cpu = 4000000L
board_hardware.oscillator = internal
board_hardware.bod = 1.8v
board_hardware.eesave = yes
board_hardware.updipin = updi
framework = arduino
monitor_speed = 9600
monitor_port = COM12
upload_protocol = serialupdi
upload_port = COM11
upload_speed = 115200
lib_extra_dirs = ../shared
lib_deps =
    https://github.com/strange-v/RFM69.git#no-readallregs
build_flags =
    -D RF69_NO_READALLREGS
    -mcall-prologues
    -D NODE_RFM69_FREQUENCY=RF69_868MHZ
    -D NODE_GATEWAY_ID=100
    -D NODE_RFM69_CS=PIN_PA4
    -D NODE_RFM69_IRQ=PIN_PA7
    -D NODE_REED_PIN=PIN_PA5
    -D NODE_BUTTON_PIN=PIN_PA6
    -D NODE_MIN_TRANSMIT_MILLIVOLTS=2000

[climate_tmp112]
extends = node
build_src_filter = +<climate_tmp112.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=23
    -D NODE_TICK_MS=32000
    -D NODE_TMP112_ADDRESS=0x48
    -D NODE_CLIMATE_ADAPTIVE_REPORTING
    -D NODE_CLIMATE_CHARGED_REPORT_INTERVAL_MS=60000UL
    -D NODE_CLIMATE_LOW_CHARGE_REPORT_INTERVAL_MS=300000UL
    -D NODE_CLIMATE_LOW_CHARGE_THRESHOLD_MV=2500

[env:climate_tmp112]
extends = climate_tmp112

[env:climate_tmp112_debug]
extends = climate_tmp112
build_flags =
    ${climate_tmp112.build_flags}
    -D NODE_DEBUG=1
    -D NODE_DEBUG_IDLE_DELAY_MS=50

[binary]
extends = node
build_src_filter = +<binary.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=15
    -D NODE_TICK_MS=250

[env:binary]
extends = binary

[env:binary_debug]
extends = binary
build_flags =
    ${binary.build_flags}
    -D NODE_DEBUG=1
    -D NODE_DEBUG_IDLE_DELAY_MS=50

[binary_sht40]
extends = node
build_src_filter = +<binary_sht40.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=15
    -D NODE_TICK_MS=250
    -D NODE_SHT40_ADDRESS=0x44
    -D NODE_BINARY_CLIMATE_REPORT_INTERVAL_MS=300000UL

[env:binary_sht40]
extends = binary_sht40

[env:binary_sht40_debug]
extends = binary_sht40
build_flags =
    ${binary_sht40.build_flags}
    -D NODE_DEBUG=1
    -D NODE_DEBUG_IDLE_DELAY_MS=50

[counter_reed]
extends = node
build_src_filter = +<counter_reed.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=15
    -D NODE_TICK_MS=250
    -D NODE_COUNTER_MINIMUM_PHASE_MS=500UL

[env:counter_reed]
extends = counter_reed

[env:counter_reed_debug]
extends = counter_reed
build_flags =
    ${counter_reed.build_flags}
    -D NODE_DEBUG=1
    -D NODE_DEBUG_IDLE_DELAY_MS=50

[env:radio_power_sweep]
extends = node
build_src_filter = +<radio_power_sweep.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=23
    -D NODE_TICK_MS=250
    -D NODE_POWER_SWEEP_FIRST_LEVEL=0
    -D NODE_POWER_SWEEP_LAST_LEVEL=31
    -D NODE_POWER_SWEEP_INTERVAL_TICKS=20

[env:radio_power_sweep_button]
extends = env:radio_power_sweep
build_flags =
    ${env:radio_power_sweep.build_flags}
    -D NODE_POWER_SWEEP_BUTTON_LEVEL

[env:radio_flood]
extends = node
build_src_filter = +<radio_flood.cpp>
build_flags =
    ${node.build_flags}
    -D NODE_RADIO_MAX_POWER_LEVEL=23
    -D NODE_TICK_MS=250
    -D NODE_FLOOD_POWER_LEVEL=2
    -D NODE_FLOOD_INTERVAL_MS=50
