[platformio]
default_envs = gateway_wt32_eth01, gateway_waveshare_s3_eth

[gateway]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.filesystem_partition = web
monitor_speed = 115200
upload_speed = 460800
; RFM69 supports ESP32 in code, but its manifest declares only the Atmel AVR
; platform. Keep exact dependency versions pinned and use soft compatibility so
; PlatformIO does not discard it. Node and gateway pin the same RFM69 commit:
; its FIFO parser bounds received lengths (node/test/test_rfm69_fifo).
lib_compat_mode = soft
lib_ldf_mode = chain
lib_extra_dirs = ../shared
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.0
    https://github.com/strange-v/RFM69.git#7246cb58b354f69e580d0a6d762e05a8b53f47a8
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D GATEWAY_REGISTRY_TIMING_LOG=0
    -D GATEWAY_RFM69_FREQUENCY=RF69_868MHZ
    -D GATEWAY_RFM69_NODE_ID=100
    -D GATEWAY_RFM69_HIGH_POWER=1
    -D GATEWAY_RFM69_TX_POWER_DBM=20

[env:gateway_wt32_eth01]
extends = gateway
board = wt32-eth01
board_build.partitions = partitions/wt32_4mb.csv
upload_speed = 115200
build_flags =
    ${gateway.build_flags}
    -D GATEWAY_BOARD_WT32_ETH01
    -D GATEWAY_RFM69_SPI_HOST=HSPI
    -D GATEWAY_RFM69_SCK=12
    -D GATEWAY_RFM69_MISO=15
    -D GATEWAY_RFM69_MOSI=4
    -D GATEWAY_RFM69_CS=14
    -D GATEWAY_RFM69_IRQ=36
    -D GATEWAY_RFM69_RESET=33

[env:gateway_wt32_eth01_ota]
extends = env:gateway_wt32_eth01
upload_protocol = espota
upload_port = osk-hub.local
extra_scripts = pre:scripts/ota_upload.py

[env:gateway_waveshare_s3_eth]
extends = gateway
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/waveshare_s3_16mb.csv
upload_speed = 921600
build_flags =
    ${gateway.build_flags}
    -D GATEWAY_BOARD_WAVESHARE_S3_ETH
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D GATEWAY_RFM69_SPI_HOST=HSPI
    -D GATEWAY_RFM69_SCK=43
    -D GATEWAY_RFM69_MISO=44
    -D GATEWAY_RFM69_MOSI=1
    -D GATEWAY_RFM69_CS=2
    -D GATEWAY_RFM69_IRQ=38
    -D GATEWAY_RFM69_RESET=39

[env:gateway_waveshare_s3_eth_ota]
extends = env:gateway_waveshare_s3_eth
upload_protocol = espota
upload_port = osk-hub.local
extra_scripts = pre:scripts/ota_upload.py
